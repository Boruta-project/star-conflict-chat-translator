# Tests on every push and pull request, plus a Windows exe build that is smoke-tested
# and kept as a downloadable artifact. Also called by release.yml before a release.
name: Tests and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-dev.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt -r requirements-dev.txt

      - name: Lint (syntax errors and undefined names only)
        run: flake8 main.py tests scripts --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run tests
        run: pytest --no-cov -q

  build-windows:
    name: Build Windows exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # the Python the release exe is built with
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-build.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt -r requirements-build.txt

      - name: Build and smoke-test the exe
        run: python scripts/build_exe.py

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error
