# Builds a release when a version tag (v1.2.3) is pushed.
#
# 1. Checks that the tag, APP_VERSION in main.py, pyproject.toml and CHANGELOG.md agree.
# 2. Runs the full test matrix and builds + smoke-tests the Windows exe (tests.yml).
# 3. Creates a DRAFT GitHub release with the exe, SHA256SUMS.txt and the CHANGELOG
#    section as notes. A maintainer reviews the draft and clicks "Publish release".
#
# How to release: docs/releasing.md
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build a draft release for (e.g. v1.4.1)"
        required: true

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        shell: bash
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/release_tools.py check-version "${{ steps.tag.outputs.tag }}"

  tests:
    needs: check-version
    uses: ./.github/workflows/tests.yml

  release:
    needs: [check-version, tests]
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.check-version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-build.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt -r requirements-build.txt

      - name: Build and smoke-test the exe
        run: python scripts/build_exe.py

      - name: Release notes from CHANGELOG.md
        shell: bash
        run: python scripts/release_tools.py notes "${TAG#v}" dist/release-notes.md

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: SC Chat Translator ${{ env.TAG }}
          body_path: dist/release-notes.md
          draft: true
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
